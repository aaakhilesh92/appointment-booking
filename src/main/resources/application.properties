spring.application.name=appointment-booking
app.scheduler.embassy.enabled=${APP_SCHEDULER_EMBASSY_ENABLED:false}
app.scheduler.vfs.enabled=${APP_SCHEDULER_VFS_ENABLED:false}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always

logging.level.org.openqa.selenium.devtools.CdpVersionFinder=ERROR
logging.level.org.openqa.selenium.chromium.ChromiumDriver=ERROR
